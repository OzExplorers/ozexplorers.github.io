<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="site-footer-inner">
        {%- assign currentYear = 'now' | date: "%Y" -%}
        {%- assign copyright = site.copyright
            | replace: '{currentYear}', currentYear
            | replace: '{author}', site.author
            | replace: '(c)', '&copy;'
            | replace: '(p)', '℗'
            | replace: '(cleft)', '<span class="copyleft">&copy;</span>'
        -%}
      <div class="footer-col rss-subscribe">
        <span class="subscribe-label">订阅 / Subscribe</span>
        <a href="{{ "/feed.xml" | relative_url }}" title="Feed RSS" target="_blank" rel="noopener noreferrer"><i
        class="fa fa-solid fa-rss" aria-hidden="true"></i> RSS</a>
        <span class="subscribe-sep" aria-hidden="true">·</span>
        <a href="https://x.com/OzExplorers" title="X(Twitter)" target="_blank" rel="noopener noreferrer"><i
        class="fa-brands fa-twitter" aria-hidden="true"></i> X</a>
      </div>
      <div>{{ copyright }}</div>
    </div>
  </div>
</footer>
